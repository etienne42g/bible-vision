<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#254f43" />
    <title>Bible Vision — Hors connexion</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #21372f; background: #f7f3ea; font-family: ui-sans-serif, system-ui, sans-serif; }
      main { width: min(440px, 100%); padding: 38px; border: 1px solid #e5dfd3; border-radius: 20px; background: #fffdf8; text-align: center; box-shadow: 0 20px 55px rgba(31,53,45,.1); }
      .mark { display: grid; width: 58px; height: 58px; margin: 0 auto 22px; place-items: center; color: #fff; border-radius: 18px 18px 18px 5px; background: #254f43; font-size: 24px; }
      h1 { margin: 0 0 10px; font-family: Georgia, serif; font-size: 34px; }
      p { margin: 0 0 22px; color: #6f7d76; line-height: 1.6; }
      button { padding: 11px 16px; color: #fff; border: 0; border-radius: 9px; background: #254f43; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">B</div>
      <h1>Vous êtes hors connexion</h1>
      <p>Les chapitres déjà consultés, vos notes et vos surlignages restent disponibles sur cet appareil.</p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
